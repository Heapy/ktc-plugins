name: Native CLI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
env:
  KTC_PLUGINS_VERSION: 0.2.0
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            module: cli-macos
            platform: macosArm64
            target: macos-arm64
          - os: ubuntu-24.04
            module: cli-linux
            platform: linuxX64
            target: linux-x64
          - os: windows-2025
            module: cli-windows
            platform: mingwX64
            target: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-kotlin-script
      - uses: Heapy/setup-ktc@cc63216665ce07ce0709fe52ef4a4b0b63aeaddc # v1.1.0
        with:
          version: auto
      - uses: Heapy/ktc-check@4575484d8e2596bde65d671991e72fadc42ad47b # v1.1.0
        with:
          modules: core
          checks: tests
          platforms: jvm, ${{ matrix.platform }}
          build: false
      - run: ./kotlin build -m '${{ matrix.module }}' --platform '${{ matrix.platform }}' -v release
      - run: kotlinr scripts/stage-binaries.main.kts '${{ matrix.platform }}'
      - name: Cross-compile ARM64 application and tests
        if: matrix.target == 'linux-x64'
        run: |
          ./kotlin build -m cli-linux --platform linuxArm64 -v release
          ./kotlin task :core:linkLinuxArm64TestDebug
          kotlinr scripts/stage-binaries.main.kts linuxArm64
          cp build/tasks/_core_linkLinuxArm64TestDebug/core_test.kexe build/binaries/core-tests-linux-arm64
      - name: Run native CLI and wrappers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          suffix=''
          target='${{ matrix.target }}'
          if [[ $target == windows-* ]]; then suffix='.exe'; fi
          binary="build/binaries/ktc-plugins-$KTC_PLUGINS_VERSION-${{ matrix.target }}$suffix"
          kotlinr scripts/smoke.main.kts "$binary"
          kotlinr scripts/test-wrappers.main.kts "$binary"
      - name: Execute installed plugin compatibility fixtures
        if: matrix.target == 'macos-arm64'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: kotlinr scripts/plugin-runtime-smoke.main.kts "build/binaries/ktc-plugins-$KTC_PLUGINS_VERSION-macos-arm64"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: binaries-${{ matrix.target }}
          path: build/binaries/*
          if-no-files-found: error
  arm64-runtime:
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-kotlin-script
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: binaries-linux-x64
          path: build/binaries
      - run: |
          chmod +x build/binaries/*
          build/binaries/core-tests-linux-arm64
          kotlinr scripts/smoke.main.kts "build/binaries/ktc-plugins-$KTC_PLUGINS_VERSION-linux-arm64"
          kotlinr scripts/test-wrappers.main.kts "build/binaries/ktc-plugins-$KTC_PLUGINS_VERSION-linux-arm64"
        env:
          GITHUB_TOKEN: ${{ github.token }}
  bundle:
    needs: [build, arm64-runtime]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-kotlin-script
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: binaries-*
          merge-multiple: true
          path: build/binaries
      - run: kotlinr scripts/package-release.main.kts --version "$KTC_PLUGINS_VERSION" --binaries build/binaries --output build/release
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-bundle
          path: build/release/*
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-bundle
          path: release
      - name: Prepare draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$TAG" = "v$KTC_PLUGINS_VERSION"
          gh release create "$TAG" release/* --verify-tag --draft --title "ktc-plugins $TAG" --generate-notes
