name: Set up Kotlin script runner
description: Install checksum-pinned Kotlin 2.4.21 and JDK 25 for main.kts scripts
runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        distribution: temurin
        java-version: '25'
    - shell: bash
      run: |
        set -euo pipefail
        destination="$RUNNER_TEMP/kotlin-script-runner"
        mkdir -p "$destination"
        curl --fail --location --retry 3 https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip -o "$destination/compiler.zip"
        checksum=7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd
        if command -v sha256sum >/dev/null 2>&1; then
          actual=$(sha256sum "$destination/compiler.zip" | cut -d ' ' -f 1)
        else
          actual=$(shasum -a 256 "$destination/compiler.zip" | cut -d ' ' -f 1)
        fi
        test "$actual" = "$checksum"
        unzip -q "$destination/compiler.zip" -d "$destination"
        script_home="$destination/kotlinc"
        if command -v cygpath >/dev/null 2>&1; then script_home=$(cygpath -w "$script_home"); fi
        echo "$script_home/bin" >> "$GITHUB_PATH"
        echo "KOTLIN_SCRIPT_HOME=$script_home" >> "$GITHUB_ENV"
